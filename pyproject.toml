[project]
name = "auto-trading"
version = "0.1.0"
description = "LLM-based automated BTC trading agent using LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Exchange API
    "pyupbit>=0.2.33",
    "pyjwt>=2.8.0",

    # LLM & Orchestration
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",

    # Data & Analysis
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    "numpy>=1.26.0",

    # HTTP & Parsing
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "websockets>=12.0",

    # Configuration & Validation
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
dashboard = [
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
]

[project.scripts]
trading = "trading.main:main"
trading-stream = "trading.main_async:main"
trading-backtest = "trading.backtest.cli:main"
trading-dashboard = "trading.dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
